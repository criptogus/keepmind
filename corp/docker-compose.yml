# OPCIONAL — não é o caminho principal do KeepMind Corp (produto = app desktop).
# Mantido apenas para auto-hospedagem experimental do servidor web.
services:
  keepmind-corp:
    build:
      context: ..
      dockerfile: corp/Dockerfile
    ports:
      - "8787:8787"
    environment:
      KEEPMIND_CORP_HOST: 0.0.0.0
      KEEPMIND_CORP_DATA: /data
      KEEPMIND_VAULT: /data/vault
      # Opcional: cria o owner no boot. Se vazio, use o onboarding em http://localhost:8787/
      KEEPMIND_CORP_OWNER_EMAIL: ${KEEPMIND_CORP_OWNER_EMAIL:-}
      KEEPMIND_CORP_OWNER_PASSWORD: ${KEEPMIND_CORP_OWNER_PASSWORD:-}
    volumes:
      - corp-data:/data
volumes:
  corp-data:
