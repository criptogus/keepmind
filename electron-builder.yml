appId: com.keepmind.app
productName: KeepMind
icon: build/icon
publish:
  provider: github
  owner: criptogus
  repo: keepmind
directories:
  output: dist
files:
  - out/**
  - package.json
  - LICENSE
  - NOTICE
  - src/main/vendor/laya/LICENSE.laya
  - tools/**
  - node_modules/**
asar: true
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  category: Utility
  target:
    - AppImage
